# Doppel monorepo root: a uv workspace. Members: lab (research), packages/doppel_model, backend/infer.
[project]
name = "doppel-chess"
version = "0.0.1"
requires-python = ">=3.12,<3.13"
dependencies = ["doppel-lab", "doppel-infer"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["lab", "packages/doppel_model", "backend/infer"]

[tool.uv.sources]
doppel-lab = { workspace = true }
doppel-infer = { workspace = true }
doppel-model = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
