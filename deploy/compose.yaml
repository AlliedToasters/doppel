# Stage 1: one cloud CPU VM. `docker compose up -d --build` from deploy/ (copy .env.example to .env first).
services:
  caddy:
    build: {context: ., dockerfile: caddy.Dockerfile}
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
      CF_API_TOKEN: ${CF_API_TOKEN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../site/dist:/srv/site:ro          # Astro landing page (npm run build in site/)
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    build: {context: .., dockerfile: deploy/Dockerfile, args: {PKG: doppel-api, EXTRAS: "--extra postgres"}}
    restart: unless-stopped
    command: uvicorn doppel_api.app:app --host 0.0.0.0 --port 8612 --proxy-headers --forwarded-allow-ips '*'
    environment:
      DOPPEL_INFER_URL: http://infer:8614
      DOPPEL_DB_URL: postgresql+psycopg://doppel:${POSTGRES_PASSWORD}@db:5432/doppel
      DOPPEL_REQUIRE_AUTH: "1"
      DOPPEL_PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN}}
    depends_on:
      db: {condition: service_healthy}
      infer: {condition: service_started}

  infer:
    build: {context: .., dockerfile: deploy/Dockerfile, args: {PKG: doppel-infer}}
    restart: unless-stopped
    command: uvicorn doppel_infer.app:app --host 0.0.0.0 --port 8614
    environment:
      DOPPEL_MODELS: /models
      DOPPEL_THREADS: ${INFER_THREADS:-4}
    volumes:
      - ../models:/models:ro   # Maia-3 packages only; ChessMimic is never deployed

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: doppel
      POSTGRES_DB: doppel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doppel"]
      interval: 5s
      retries: 10

  # Off by default: only one host may run the doppelbot account. `docker compose --profile bot up -d`.
  lichess_bot:
    profiles: [bot]
    build: {context: .., dockerfile: deploy/Dockerfile, args: {PKG: doppel-lichess-bot}}
    restart: unless-stopped
    command: python -m doppel_lichess_bot.runner --infer-url http://infer:8614
    volumes:
      - ./secrets/lichess_bot.token:/home/app/.config/doppel/lichess_bot.token:ro
    depends_on: [infer]

volumes:
  caddy_data:
  caddy_config:
  pg:
