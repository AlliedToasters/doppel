[project]
name = "doppel-lichess-bot"
version = "0.0.1"
description = "Doppel on Lichess: one BOT account, Bot API event stream -> backend/infer"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx", "python-chess", "numpy", "doppel-model"]

[tool.uv.sources]
doppel-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_lichess_bot"]
