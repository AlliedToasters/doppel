[project]
name = "doppel-api"
version = "0.0.1"
description = "Doppel API: server-authoritative Doppel-hosted games (later accounts, consent, ratings, export)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn[standard]", "sqlalchemy>=2", "httpx", "python-chess", "numpy"]

[project.optional-dependencies]
postgres = ["psycopg[binary]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_api"]
