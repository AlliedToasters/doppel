[project]
name = "doppel-infer"
version = "0.0.1"
description = "Stateless CPU move server for Doppel model packages (ONNX Runtime)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["doppel-model", "onnxruntime", "fastapi", "uvicorn[standard]", "numpy", "python-chess"]

[tool.uv.sources]
doppel-model = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_infer"]
