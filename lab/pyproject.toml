[project]
name = "doppel-lab"
version = "0.0.1"
description = "Doppel research sandbox: ingest, Stockfish analysis, baselines, metrics, training"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch>=2.7",
  "numpy",
  "python-chess",
  "pyarrow",
  "polars",
  "duckdb",
  "zstandard",
  "scipy",
  "scikit-learn",
  "huggingface_hub",
  "nanobind",
  "tqdm",
  "lightning>=2.6.6",
  "torchmetrics>=1.9.0",
  "orjson>=3.13.0",
  "fastapi>=0.162.0",        # demo/server.py until backend/ replaces it
  "uvicorn[standard]>=0.54.0",
  "maia3",
]

[tool.uv.sources]
maia3 = { path = "../vendor/maia3", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_lab"]
