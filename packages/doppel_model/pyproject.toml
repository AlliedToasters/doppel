[project]
name = "doppel-model"
version = "0.0.1"
description = "Shared encoding/decoding for Doppel model packages (lab trains through it, backend serves through it)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy", "python-chess"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["doppel_model"]
